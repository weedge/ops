<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Popto 产品运营研发流水线</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --wash:rgba(11,11,11,.04);
    --s1:#2a78d6; --track:#cde2fb; --neutral:#b5b4ac;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --tip-bg:#0b0b0b; --tip-fg:#f0efec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --wash:rgba(255,255,255,.05);
      --s1:#3987e5; --track:#0d366b; --neutral:#5b5a55;
      --tip-bg:#f0efec; --tip-fg:#0b0b0b;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:14px/1.55 system-ui, -apple-system, "PingFang SC", "Segoe UI", sans-serif; }
  main { max-width:1320px; margin:0 auto; padding:20px 16px 72px; }
  a { color:inherit; text-decoration:underline; text-decoration-color:var(--axis); text-underline-offset:3px; }
  a:hover { text-decoration-color:currentColor; }
  code { font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background:var(--wash); border:1px solid var(--border); border-radius:6px; padding:2px 6px; white-space:nowrap; }

  header.top { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 16px; }
  h1 { font-size:20px; margin:0; }
  .sub { color:var(--ink2); font-size:13px; }
  .stale { margin-top:10px; padding:8px 12px; border:1px solid var(--border); border-left:3px solid var(--warn); border-radius:8px; background:var(--surface); }

  /* 状态条 */
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 4px; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border:1px solid var(--border); border-radius:999px; background:var(--surface); font-size:13px; }
  .chip small { color:var(--ink2); font-size:12px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--neutral); flex:none; }
  .good > .dot, .dot.good { background:var(--good); } .warn > .dot, .dot.warn { background:var(--warn); }
  .crit > .dot, .dot.crit { background:var(--crit); } .info > .dot, .dot.info { background:var(--s1); }
  .serious > .dot, .dot.serious { background:var(--serious); }

  /* 页签 */
  nav.tabs { position:sticky; top:0; z-index:5; display:flex; gap:4px; overflow-x:auto; margin:12px -16px 16px; padding:8px 16px; background:var(--page); border-bottom:1px solid var(--grid); }
  nav.tabs button { font:inherit; color:var(--ink2); background:none; border:0; border-radius:8px; padding:6px 12px; cursor:pointer; white-space:nowrap; }
  nav.tabs button:hover { background:var(--wash); }
  nav.tabs button[aria-selected="true"] { color:var(--ink); font-weight:600; background:var(--surface); box-shadow:inset 0 0 0 1px var(--border); }
  nav.tabs button .n { margin-left:6px; font-size:12px; font-weight:600; padding:0 6px; border-radius:999px; background:var(--crit); color:#fff; }
  section.tab { display:none; } section.tab.on { display:block; }

  /* 布局 */
  .grid { display:grid; gap:16px; margin-bottom:16px; }
  .g2 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
  .g3 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); }
  .g5 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
  .g6 { grid-template-columns:repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; min-width:0; }
  .card.block { margin-bottom:16px; }
  .card > h2 { font-size:15px; margin:0 0 2px; }
  .card > .hint { color:var(--ink2); font-size:12px; margin:0 0 12px; }
  .card > h2 + :not(.hint) { margin-top:12px; }
  .empty { color:var(--muted); padding:8px 0; }
  .scroll { overflow-x:auto; }
  h3 { font-size:13px; font-weight:600; margin:16px 0 8px; color:var(--ink2); }
  h3:first-child { margin-top:0; }

  /* 指标格 */
  .tile { display:flex; flex-direction:column; }
  .tile .label { color:var(--ink2); font-size:13px; }
  .tile .value { font-size:28px; font-weight:600; line-height:1.25; margin:2px 0; }
  .tile .value small { font-size:14px; font-weight:500; color:var(--ink2); margin-left:2px; }
  .tile .foot { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:12px; color:var(--ink2); }
  .tile svg { display:block; margin-top:auto; padding-top:8px; box-sizing:content-box; }
  .mini { display:flex; flex-wrap:wrap; gap:6px 20px; margin:10px 0 0; }
  .mini div { font-size:12px; color:var(--ink2); } .mini b { display:block; font-size:18px; font-weight:600; color:var(--ink); }
  button.link { font:inherit; color:var(--ink2); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-decoration-color:var(--axis); text-underline-offset:3px; font-size:12px; }

  /* 徽标：圆点带颜色，文字用正文色 */
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; white-space:nowrap; }
  .tag { display:inline-block; font-size:12px; padding:0 6px; border:1px solid var(--border); border-radius:6px; color:var(--ink2); white-space:nowrap; }

  /* 待你处理 */
  .todo { list-style:none; margin:0; padding:0; }
  .todo li { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; padding:12px 0; border-top:1px solid var(--grid); }
  .todo li:first-child { border-top:0; padding-top:4px; }
  .todo .what { font-weight:600; } .todo .more { color:var(--ink2); font-size:13px; grid-column:2; }
  .todo .acts { grid-column:2; display:flex; flex-wrap:wrap; gap:6px 8px; align-items:center; font-size:12px; color:var(--ink2); }
  button.copy { font:12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color:var(--ink); background:var(--wash); border:1px solid var(--border); border-radius:6px; padding:2px 8px; cursor:pointer; }
  button.copy:hover { border-color:var(--axis); } button.copy.ok { border-color:var(--good); }

  /* 表格 */
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:7px 10px 7px 0; border-bottom:1px solid var(--grid); vertical-align:top; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  th { color:var(--ink2); font-weight:500; font-size:12px; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  td.wrap { white-space:normal; min-width:220px; } td.wide { white-space:normal; min-width:300px; }
  td .s { display:block; color:var(--ink2); font-size:12px; white-space:normal; }
  .clamp { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  tr.off td { color:var(--muted); }

  /* 细分段条：一个整体拆成几种状态 */
  .seg { display:flex; gap:2px; height:8px; min-width:90px; width:120px; }
  .seg i { display:block; border-radius:4px; min-width:3px; }
  .seg.wide { width:100%; }
  .st-done { background:var(--good); } .st-waiting_decision { background:var(--warn); } .st-failed { background:var(--crit); }
  .st-queued, .st-leased { background:var(--s1); } .st-cancelled { background:var(--neutral); }
  .legend { display:flex; flex-wrap:wrap; gap:4px 14px; font-size:12px; color:var(--ink2); margin:0 0 10px; }
  .legend span { display:inline-flex; align-items:center; gap:5px; }
  .legend i { width:10px; height:10px; border-radius:3px; display:inline-block; }

  /* 横条：比大小 */
  .hb { display:grid; grid-template-columns:minmax(64px, max-content) 1fr; gap:7px 10px; align-items:center; }
  .hb .l { color:var(--ink2); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:180px; }
  .hb .t { display:flex; align-items:center; gap:8px; min-width:0; }
  .hb .t i { display:block; height:12px; background:var(--s1); border-radius:0 4px 4px 0; min-width:2px; }
  .hb .t b { font-weight:500; font-variant-numeric:tabular-nums; white-space:nowrap; } .hb .t small { color:var(--ink2); white-space:nowrap; }

  /* 用量条 */
  .meter { margin-bottom:12px; } .meter:last-child { margin-bottom:0; }
  .meter .row { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
  .meter .row span:last-child { color:var(--ink2); font-variant-numeric:tabular-nums; }
  .meter .bar { position:relative; height:8px; border-radius:4px; background:var(--track); margin-top:4px; }
  .meter .bar i { display:block; height:100%; border-radius:4px; background:var(--s1); }
  .meter.warn .bar i { background:var(--warn); } .meter.crit .bar i { background:var(--crit); }
  .meter .bar u { position:absolute; top:-2px; width:2px; height:12px; background:var(--ink2); }

  /* 内容日历 */
  .cal { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap:10px; }
  .day { border:1px solid var(--grid); border-radius:10px; padding:10px; min-width:0; }
  .day.today { border-color:var(--s1); }
  .day h4 { margin:0 0 8px; font-size:13px; } .day h4 small { color:var(--ink2); font-weight:400; margin-left:6px; }
  .item { padding:7px 0; border-top:1px solid var(--grid); font-size:13px; } .item:first-of-type { border-top:0; padding-top:0; }
  .item.child { padding-left:12px; }
  .item .m { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; margin-top:3px; color:var(--ink2); font-size:12px; }

  /* 列表 */
  .list { list-style:none; margin:0; padding:0; }
  .list li { padding:10px 0; border-top:1px solid var(--grid); } .list li:first-child { border-top:0; padding-top:0; }
  .list .hd { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; } .list .hd b { font-weight:600; }
  .list .hd small { color:var(--ink2); } .list p { margin:3px 0 0; color:var(--ink2); font-size:13px; }
  details > summary { cursor:pointer; color:var(--ink2); font-size:13px; margin-top:8px; }
  .chk { display:inline-flex; gap:4px; } .chk span { font-size:11px; padding:0 5px; border-radius:5px; border:1px solid var(--border); color:var(--ink2); }
  .chk .done { border-color:var(--good); color:var(--ink); } .chk .overdue { border-color:var(--crit); color:var(--ink); } .chk .skipped { color:var(--muted); text-decoration:line-through; }

  /* 图 */
  svg text { fill:var(--ink2); font-size:11px; font-family:inherit; } svg text.cap { fill:var(--ink); font-weight:500; }
  svg .gl { stroke:var(--grid); stroke-width:1; } svg .ax { stroke:var(--axis); stroke-width:1; }
  svg .col:hover rect.bar, svg .col:focus rect.bar { opacity:.82; } svg .col { outline:none; }
  #tip { position:fixed; z-index:20; pointer-events:none; display:none; max-width:320px; padding:6px 9px; border-radius:8px; background:var(--tip-bg); color:var(--tip-fg); font-size:12px; line-height:1.5; white-space:pre-line; }
</style>
</head>
<body>
<main>
  <header class="top"><h1>Popto 产品运营研发流水线</h1><span class="sub" id="sub"></span></header>
  <div id="stale"></div>
  <div class="chips" id="chips"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <section class="tab" id="t-overview"></section>
  <section class="tab" id="t-content"></section>
  <section class="tab" id="t-data"></section>
  <section class="tab" id="t-dev"></section>
  <section class="tab" id="t-growth"></section>
  <section class="tab" id="t-system"></section>
</main>
<div id="tip" role="tooltip"></div>
<script>
const D = /*__DATA__*/null;

/* ---------- 基础：所有数据都用 textContent 写进页面（评论、线索、帖子标题都是外部内容） ---------- */
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "tip") { e.dataset.tip = v; e.tabIndex = 0; }
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  return put(e, kids);
}
function put(el, ...kids) {
  for (const kid of kids.flat(4)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...kids) {
  const e = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) { if (k === "text") e.textContent = v; else e.setAttribute(k, v); }
  e.append(...kids.filter(Boolean));
  return e;
}
const $ = id => document.getElementById(id);
const sum = a => a.reduce((x, y) => x + (y || 0), 0);

/* ---------- 文字格式 ---------- */
const GEN = D ? new Date(D.generated_at) : new Date();
const p2 = n => String(n).padStart(2, "0");
const WD = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
const dayKey = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
function num(v, digits) {
  if (v == null || v === "") return "—";
  const n = Number(v);
  if (!isFinite(n)) return String(v);
  if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1) + " 万";
  return digits != null ? n.toFixed(digits) : n.toLocaleString("zh-CN", { maximumFractionDigits: 1 });
}
const pct = (v, d = 0) => v == null ? "—" : (v * 100).toFixed(d) + "%";
function dur(sec) {
  if (sec == null) return "—";
  if (sec < 90) return Math.round(sec) + " 秒";
  if (sec < 5400) return (sec / 60).toFixed(sec < 600 ? 1 : 0) + " 分钟";
  return (sec / 3600).toFixed(1) + " 小时";
}
/* 时间都相对“生成时刻”算：这是静态快照，不能拿打开页面的时间来算“几分钟前” */
function when(iso) {
  if (!iso) return "—";
  const t = new Date(String(iso).replace(/^skipped:/, "").replace(/([+-]\d{2})(\d{2})$/, "$1:$2"));
  if (isNaN(t)) return String(iso);
  const diff = (t - GEN) / 60000, a = Math.abs(diff), hm = `${p2(t.getHours())}:${p2(t.getMinutes())}`;
  const days = Math.round((new Date(dayKey(t)) - new Date(dayKey(GEN))) / 864e5);
  if (a < 1) return "刚刚";
  if (a < 60) return Math.round(a) + (diff < 0 ? " 分钟前" : " 分钟后");
  if (days === 0) return "今天 " + hm;
  if (days === -1) return "昨天 " + hm;
  if (days === 1) return "明天 " + hm;
  if (days > 1 && days < 7) return `${WD[t.getDay()]} ${hm}`;
  return `${p2(t.getMonth() + 1)}-${p2(t.getDate())} ${hm}`;
}
const left = iso => { const m = (new Date(iso) - GEN) / 60000; return m <= 0 ? "已到期" : m < 60 ? `还剩 ${Math.round(m)} 分钟` : `还剩 ${Math.round(m / 60)} 小时`; };
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : null;
const link = (text, url) => safeUrl(url) ? h("a", { href: url, target: "_blank", rel: "noopener noreferrer", text }) : text;

/* ---------- 名称对照 ---------- */
const L = {
  state: { done: "完成", failed: "失败", cancelled: "已取消", queued: "排队中", leased: "运行中", waiting_decision: "等人批" },
  stateTone: { done: "good", failed: "crit", cancelled: "", queued: "info", leased: "info", waiting_decision: "warn" },
  platform: { douyin: "抖音", wechat_channels: "视频号", xiaohongshu: "小红书", bilibili: "B 站", kuaishou: "快手", zhihu: "知乎", wechat_mp: "公众号" },
  content: { proposed: "待批选题", approved: "选题已批", scripted: "脚本完成", media_ready: "素材完成", expired: "已过期" },
  pack: { ready: "待发卡片", carded: "卡片已发", approved: "已批准", published: "已发布", rejected: "不发", failed: "发布失败" },
  packTone: { ready: "info", carded: "warn", approved: "info", published: "good", rejected: "", failed: "crit" },
  action: { awaiting_manual: "等人手动发", done: "已执行", running: "执行中", failed: "执行失败" },
  mode: { off: "人工发布", dry_run: "试运行（不真发）", live: "自动发布", semi_auto: "半自动", manual: "人工", auto: "自动" },
  demand: { open: "待评估", approved: "已批准", prd_review: "PRD 待批", in_dev: "开发中", done: "已上线", ops_backlog: "运营系统待办", rejected: "不做" },
  demandTone: { open: "info", approved: "info", prd_review: "warn", in_dev: "info", done: "good", ops_backlog: "", rejected: "" },
  lead: { creator: "创作者", team_lead: "团队长", mcn: "MCN", other: "其他" },
  term: { pain: "痛点词", solution: "方案词", brand: "品牌词", competitor: "竞品词" },
  tell: { never: "不通知", needed: "要拍板时发卡片", always: "每次都发", digest: "进日报" },
  routed: { task: "生成任务", none: "只留底", internal: "中台内部处理", unmatched: "没有规则接", paused: "已暂停", "": "—" },
  sched: { fired: "已触发", pending: "到点未触发", missed: "已错过", off: "未启用" },
  schedTone: { fired: "good", pending: "warn", missed: "", off: "" },
  err: { network: "网络", invalid_output: "输出不合格", timeout: "超时", quota: "额度", auth: "认证", error: "报错", stale: "租约过期" },
  cardKind: { demand_top: "需求 Top 10", release: "合并", topic_calendar: "内容日历", publish_batch: "发布", lead_batch: "线索", reply_batch: "评论回复", prd: "PRD", cleanup: "清理" },
  cardStatus: { pending: "待发出", sent: "待批", decided: "已批", expired: "已过期" },
  cardTone: { pending: "info", sent: "warn", decided: "good", expired: "" },
  agentState: { closed: "正常", open: "熔断中", half_open: "试探恢复" },
  agentTone: { closed: "good", open: "crit", half_open: "warn" },
  comment: { demand: "需求", question: "提问", praise: "夸奖", negative: "负面", spam: "垃圾", lead: "线索", pos: "正面", neu: "中性", neg: "负面", none: "未回复", drafted: "有草稿", approved: "已批准", sent: "已回复" },
  kind: { question: "提问", quality: "质量", pricing: "定价", pain: "痛点", feature_request: "功能需求", bug: "缺陷", praise: "夸奖", competitor: "竞品" },
  signal: { mining: "需求挖掘", listening: "社媒监听", comment: "评论", incident: "线上故障" },
  outbox: { card: "卡片", card_batch: "待批清单", message: "消息", file: "文件", alert: "告警" },
  job: { done: "已采", pending: "未到点", overdue: "到点未采", skipped: "登记时已过点" },
};
const name = (map, k) => (L[map] && L[map][k]) || (k == null || k === "" ? "—" : k);
const badge = (text, tone) => h("span", { class: "badge " + (tone || "") }, h("i", { class: "dot" }), text);

/* ---------- 组件 ---------- */
function card(title, hint, ...body) {
  return h("div", { class: "card" }, title && h("h2", { text: title }), hint && h("p", { class: "hint", text: hint }), body);
}
const empty = (text = "暂无数据") => h("div", { class: "empty", text });
function table(rows, cols, opts = {}) {
  if (!rows || !rows.length) return empty(opts.empty);
  return h("div", { class: "scroll" }, h("table", null,
    h("thead", null, h("tr", null, cols.map(c => h("th", { class: c.cls && c.cls.includes("num") ? "num" : null, text: c.t })))),
    h("tbody", null, rows.map(r => h("tr", { class: opts.rowClass ? opts.rowClass(r) : null },
      cols.map(c => h("td", { class: c.cls || null }, c.f ? c.f(r) : (r[c.k] ?? "—"))))))));
}
function hbars(items, opts = {}) {
  if (!items || !items.length) return empty(opts.empty);
  if (items.length === 1) return h("div", { class: "mini", style: "margin:0" }, h("div", null, h("b", { text: num(items[0].n) }), items[0].label + (items[0].note ? " · " + items[0].note : "")));
  const max = Math.max(1, ...items.map(i => i.n || 0));

  const top = Math.ceil(rawMax / nice) * nice, y = v => padT + plotH - v / top * plotH, band = (W - padL) / days.length, bw = Math.min(24, band * 0.5);
  const g = s("svg", { viewBox: `0 0 ${W} ${H}`, width: "100%", style: `max-width:${W}px`, role: "img", "aria-label": "每天 Agent 运行次数" });
  for (let v = 0; v <= top; v += nice) {
    g.append(s("line", { class: v ? "gl" : "ax", x1: padL, x2: W, y1: y(v), y2: y(v) }), s("text", { x: padL - 6, y: y(v) + 4, "text-anchor": "end", text: num(v) }));
  }

      const y1 = y(base + x.v[i]), hgt = Math.max(1, y(base) - y1 - (j < live.length - 1 ? 2 : 0)), isTop = j === live.length - 1, r = isTop ? Math.min(4, hgt) : 0;

            h("div", { class: "m" }, i.pillar && h("span", { class: "tag", text: "支柱 " + i.pillar }), i.persona && h("span", { text: i.persona }),
              badge(name("content", i.status), i.status === "expired" ? "" : "info"),
              i.packs.map(p => h("span", { class: "tag", text: `${name("platform", p.platform)} ${name("pack", p.status)}` }))))));
      })) : empty("还没有排期的内容")),
    card("发布包", "17:00 汇成「今晚发布」卡片，批准后自动发或推给人发。", table(C.packs, [
      { t: "计划时间", f: r => when(r.scheduled_at) }, { t: "平台", f: r => name("platform", r.platform) }, { t: "标题", cls: "wrap", k: "title" },
      { t: "方式", f: r => name("mode", r.publish_mode) }, { t: "状态", f: r => badge(name("pack", r.status), L.packTone[r.status]) },
      { t: "执行", f: r => r.action_status ? name("action", r.action_status) : "—" }, { t: "发布包 ID", f: r => h("code", { text: r.id }) },
    ], { empty: "还没有发布包" })),
    h("div", { style: "height:16px" }), ruleTable("content"));
}

/* ---------- 数据回收 ---------- */
function renderData() {
  const A = D.data, j = A.jobs;
  const eng = r => r.views ? ((r.likes || 0) + (r.comments || 0) + (r.shares || 0) + (r.favorites || 0)) / r.views : null;
  const totals = A.funnel.reduce((t, r) => ({ clicks: t.clicks + (r.clicks || 0), reg: t.reg + (r.reg || 0), first_done: t.first_done + (r.first_done || 0), paid: t.paid + (r.paid || 0) }), { clicks: 0, reg: 0, first_done: 0, paid: 0 });
  put($("t-data"), 
    h("div", { class: "grid g6" },
      tile({ label: "登记的帖子", value: num(A.posts.length), foot: "自动发布成功或回复「已发」后登记" }),
      tile({ label: "数据快照", value: num(A.snapshots), foot: `已采 ${j.done} 个节点` }),
      tile({ label: "还没到点的采集", value: num(j.pending), foot: "发布后 1 小时 / 24 小时 / 72 小时 / 7 天" }),
      tile({ label: "到点没采到", value: num(j.overdue), ok: j.overdue ? false : null, foot: j.overdue ? "每 30 分钟会再试" : "没有积压" }),
      tile({ label: "评论", value: num(A.comments.total), foot: "保留期到了会自动清掉" })),
    card("自有内容最新数据", "每条取最近一次快照。节点上有删除线的是登记时已经过点、没采的。", table(A.posts, [
      { t: "平台", f: r => name("platform", r.platform) },
      { t: "标题", cls: "wrap", f: r => [link(r.title || r.id, r.url), h("span", { class: "s", text: [r.account, when(r.published_at) + " 发布"].filter(Boolean).join(" · ") })] },
      { t: "播放", cls: "num", f: r => num(r.views) }, { t: "赞", cls: "num", f: r => num(r.likes) }, { t: "评", cls: "num", f: r => num(r.comments) },
      { t: "转", cls: "num", f: r => num(r.shares) }, { t: "藏", cls: "num", f: r => num(r.favorites) },
      { t: "互动率", cls: "num", f: r => pct(eng(r), 1) }, { t: "完播率", cls: "num", f: r => pct(r.completion_rate, 1) },
      { t: "最近快照", f: r => r.captured_at ? when(r.captured_at) : "还没采" },
      { t: "采集节点", f: r => h("span", { class: "chk" }, r.jobs.map(x => h("span", { class: x.state, tip: `${x.checkpoint}：${L.job[x.state]}\n应采时间 ${when(x.due_at)}${x.error ? "\n" + x.error : ""}`, text: x.checkpoint === "late" ? "补采" : x.checkpoint }))) },
    ], { empty: "还没有登记的帖子" })),
    h("div", { style: "height:16px" }),
    h("div", { class: "grid g2" },
      card("接下来要采的", "到点的指标快照任务每 30 分钟检查一次。", table(A.upcoming_jobs, [
        { t: "应采时间", f: r => when(r.due_at) }, { t: "平台", f: r => name("platform", r.platform) }, { t: "标题", cls: "wrap", f: r => r.title || r.post_id },
        { t: "节点", k: "checkpoint" }, { t: "试过", cls: "num", f: r => r.attempts || "—" },
      ], { empty: "没有排队的采集" })),
      card("评论分拣", `共 ${A.comments.total} 条。回复都要人批，发出时不带链接和联系方式。`,
        h("h3", { text: "类型" }), hbars(A.comments.category.map(i => ({ label: name("comment", i.label), n: i.n }))),
        h("h3", { text: "情绪" }), hbars(A.comments.sentiment.map(i => ({ label: name("comment", i.label), n: i.n }))),
        h("h3", { text: "回复进度" }), hbars(A.comments.reply.map(i => ({ label: name("comment", i.label), n: i.n }))))),
    h("div", { class: "grid g2" },
      card("渠道漏斗（按天）", "每天 06:40 导入。", A.funnel.length ? [
        h("div", { class: "mini", style: "margin:0 0 12px" }, [["点击", totals.clicks], ["注册", totals.reg], ["首条完成", totals.first_done], ["付费", totals.paid]].map(x => h("div", null, h("b", { text: num(x[1]) }), x[0])),

        { t: "注册", cls: "num", f: r => num(r.reg) }, { t: "首条完成", cls: "num", f: r => num(r.first_done) }, { t: "付费", cls: "num", f: r => num(r.paid) }], { empty: "暂无数据" }))),

/* ---------- 需求与开发 ---------- */

    ruleTable("dev"));
}

/* ---------- 获客 ---------- */
function renderGrowth() {
  const G = D.growth, latest = (t, x, none) => card(t, x ? `${when(x.at)} · ${x.agent || "—"} · ${name("state", x.state)}` : null, x ? h("p", { style: "margin:0;color:var(--ink2)", text: x.summary || "没有摘要" }) : empty(none));

    h("div", { class: "grid g2" },
      dist("线索走到哪一步", G.stages, null, `共 ${G.total} 条。批准后记为“待跟进”，由人用品牌号互动，系统不自动评论或私信。`),

      { t: "为什么是线索", cls: "wide", f: r => h("span", { class: "clamp", title: r.why, text: r.why || "—" }) },

}

/* ---------- 系统 ---------- */
function renderSystem() {
  const d = D.daily, css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  put($("t-system"), 
    h("div", { class: "grid g2" },
      card("每天的 Agent 运行次数", `${D.window}共 ${num(D.kpi.runs)} 次，含确定性脚本。`, D.kpi.runs ? columns(d.days, [
        { name: "成功", v: d.runs_ok, color: css("--s1") }, { name: "失败", v: d.runs_fail, color: css("--crit") }]) : empty("这段时间没有运行")),
      card("事件去向", `${D.window}共 ${num(D.kpi.events)} 个事件。`, table(D.events.slice(0, 14), [
        { t: "事件类型", f: r => h("code", { text: r.type }) }, { t: "去向", f: r => name("routed", r.routed) }, { t: "数量", cls: "num", f: r => num(r.n) }, { t: "最近", f: r => when(r.last_at) }]),
        D.events.length > 14 && h("details", null, h("summary", { text: `其余 ${D.events.length - 14} 种` }), table(D.events.slice(14), [
          { t: "事件类型", f: r => h("code", { text: r.type }) }, { t: "去向", f: r => name("routed", r.routed) }, { t: "数量", cls: "num", f: r => num(r.n) }, { t: "最近", f: r => when(r.last_at) }])))),
    card("Agent", "额度或认证错误会熔断并换下一个；同一个 Agent 连续 3 次超时熔断 30 分钟。", table(D.agents, [
      { t: "Agent", f: r => [r.agent, h("span", { class: "s", text: (r.capabilities || []).join(" / ") })] },
      { t: "状态", f: r => [badge(name("agentState", r.state), L.agentTone[r.state]), r.open_until && h("span", { class: "s", text: "到 " + when(r.open_until) })] },
      { t: "运行", cls: "num", f: r => r.runs || "—" }, { t: "成功率", cls: "num", f: r => r.runs ? pct(r.ok / r.runs) : "—" },
      { t: "失败", cls: "wrap", f: r => r.fail ? Object.entries(r.errors).map(([k, n]) => `${name("err", k)} ${n}`).join(" · ") : "—" },

      { t: "并发", cls: "num", f: r => r.concurrency ?? "—" }, { t: "周用量", cls: "num", f: r => r.usage_ratio == null ? "未登记" : pct(r.usage_ratio) },
    ])),
    h("div", { style: "height:16px" }),
    h("div", { class: "grid g2" },
      card("失败的运行", "失败后已经自动重试或换 Agent；最终没救回来的任务在总览的“待你处理”里。", table(D.failed_runs, [
        { t: "时间", f: r => when(r.finished_at) }, { t: "规则", cls: "wrap", f: r => [r.rule || r.task_id, h("span", { class: "s", text: `${r.agent}${r.is_fallback ? "（替补）" : ""} · ${name("err", r.error_kind || r.status)} · ${dur(r.duration_s)}` })] },
        { t: "原因", cls: "wide", f: r => h("span", { class: "clamp", title: r.error_detail, text: r.error_detail || "—" }) },
      ], { empty: "这段时间没有失败的运行" })),
      h("div", { class: "grid", style: "margin:0;align-content:start" },
        card("正在排队和等批的任务", null, table(D.queue, [
          { t: "规则", cls: "wrap", f: r => [r.rule, h("span", { class: "s", text: r.summary || "" })] }, { t: "状态", f: r => badge(name("state", r.state), L.stateTone[r.state]) },
          { t: "优先级", cls: "num", f: r => "P" + r.priority }, { t: "进队列", f: r => when(r.created_at) }], { empty: "队列是空的" })),
        card("发出去的通知", "中台是唯一的通知出口。", hbars(D.outbox.map(o => ({ label: name("outbox", o.kind) + (o.status === "sent" ? "" : `（${o.status}）`), n: o.n })), { empty: "这段时间没有发过通知" })))),
    h("div", { class: "grid g2" },
      card("系统改进建议", `Agent 干活时发现的运营系统自身问题，${D.window}共 ${D.feedback.total} 条，显示最近 ${D.feedback.items.length} 条。`,
        D.feedback.items.length ? [h("ul", { class: "list" }, D.feedback.items.slice(0, 8).map(fbItem)),
          D.feedback.items.length > 8 && h("details", null, h("summary", { text: `再看 ${D.feedback.items.length - 8} 条` }), h("ul", { class: "list", style: "margin-top:10px" }, D.feedback.items.slice(8).map(fbItem)))] : empty("这段时间没有")),
      card("定的事和定了不做的事", "Agent 执行前先查这里，定过的直接照办。", D.decisions.length ? h("ul", { class: "list" }, D.decisions.map(x =>
        h("li", null, h("div", { class: "hd" }, h("b", { text: x.title }), h("small", { text: [x.kind, x.id, x.date, x.review && "复查 " + x.review].filter(Boolean).join(" · ") })), x.scope && h("p", { text: x.scope })))) : empty())),
    ruleTable("system"));
}
const fbItem = x => h("li", null, h("div", { class: "hd" }, h("b", { text: x.area || "未注明" }), h("small", { text: when(x.at) })),
  h("p", { text: x.problem }), x.suggestion && h("p", { text: "建议：" + x.suggestion }));

/* ---------- 页签与提示 ---------- */
const TABS = [["overview", "总览"], ["content", "内容"], ["data", "数据回收"], ["dev", "需求与开发"], ["growth", "获客"], ["system", "系统"]];
function show(key) {
  if (!TABS.some(t => t[0] === key)) key = "overview";
  for (const [k] of TABS) {
    $("t-" + k).classList.toggle("on", k === key);
    $("tab-" + k).setAttribute("aria-selected", String(k === key));
  }
  try { history.replaceState(null, "", "#" + key); } catch (e) { /* file:// 下个别浏览器不让改地址，不影响切换 */ }
  window.scrollTo(0, 0);
}
function initTip() {
  const tip = $("tip");
  const at = (el, x, y) => {
    tip.textContent = el.dataset.tip; tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.max(8, Math.min(x + 12, innerWidth - r.width - 8)) + "px";
    tip.style.top = (y + 16 + r.height > innerHeight ? y - r.height - 10 : y + 16) + "px";
  };
  const find = t => t && t.closest ? t.closest("[data-tip]") : null;
  document.addEventListener("pointermove", e => { const el = find(e.target); el ? at(el, e.clientX, e.clientY) : (tip.style.display = "none"); });
  document.addEventListener("focusin", e => { const el = find(e.target); if (el) { const r = el.getBoundingClientRect(); at(el, r.left, r.bottom - 8); } });
  document.addEventListener("focusout", () => { tip.style.display = "none"; });
}

if (!D) {
  $("sub").textContent = "没有数据：请用 opsctl dashboard 生成。";
} else {
  put($("tabs"), TABS.map(([k, t]) => h("button", { id: "tab-" + k, role: "tab", text: t, onclick: () => show(k) })));
  renderTop();
  const todo = renderOverview();
  if (todo) put($("tab-overview"), h("span", { class: "n", text: todo }));
  renderContent(); renderData(); renderDev(); renderGrowth(); renderSystem();
  initTip();
  show(location.hash.slice(1) || "overview");
}
